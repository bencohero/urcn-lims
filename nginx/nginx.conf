worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-font-ttf
               font/opentype image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Upstream definitions
    upstream auth_service {
        server auth-service:8000;
        keepalive 32;
    }

    upstream core_api {
        server core-api:8001;
        keepalive 32;
    }

    upstream rfid_service {
        server rfid-service:8002;
        keepalive 32;
    }

    upstream workflow_engine {
        server workflow-engine:8003;
        keepalive 32;
    }

    upstream notification_service {
        server notification-service:8004;
        keepalive 32;
    }

    upstream reporting_service {
        server reporting-service:8005;
        keepalive 32;
    }

    upstream audit_service {
        server audit-service:8006;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Client max body size (for file uploads)
        client_max_body_size 50M;

        # Frontend
        location / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_params;
        }

        # Auth Service
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://auth_service/api/v1/auth/;
            include /etc/nginx/proxy_params;
        }

        # RFID Service
        location /api/v1/rfid/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://rfid_service/api/v1/rfid/;
            proxy_set_header Authorization $http_authorization;
            include /etc/nginx/proxy_params;
        }

        # Workflow Engine (Access Requests)
        location /api/v1/access-requests/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://workflow_engine/api/v1/access-requests;
            proxy_set_header Authorization $http_authorization;
            include /etc/nginx/proxy_params;
        }

        # Notification Service
        location /api/v1/notifications/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://notification_service/api/v1/notifications/;
            proxy_set_header Authorization $http_authorization;
            include /etc/nginx/proxy_params;
        }

        # WebSocket for notifications
        location /ws/ {
            proxy_pass http://notification_service/ws/;
            proxy_set_header Authorization $http_authorization;
            include /etc/nginx/proxy_params;
        }

        # Reporting Service
        location /api/v1/reports/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://reporting_service/api/v1/reports/;
            proxy_set_header Authorization $http_authorization;
            include /etc/nginx/proxy_params;
        }

        # Audit Service
        location /api/v1/audit-trail/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://audit_service/api/v1/audit-trail/;
            proxy_set_header Authorization $http_authorization;
            include /etc/nginx/proxy_params;
        }

        # Core API (catch-all for /api/v1/)
        location /api/v1/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://core_api/api/v1/;
            proxy_set_header Authorization $http_authorization;
            include /etc/nginx/proxy_params;
        }

        # Health check endpoints (no rate limiting)
        location /health/ {
            proxy_pass http://core_api/health;
            proxy_set_header Host $host;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # HTTPS server (uncomment for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name localhost;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_session_tickets off;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_prefer_server_ciphers off;
    #
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # Same location blocks as HTTP server
    # }
}
