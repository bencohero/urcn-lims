version: '3.8'

services:
  # PostgreSQL Master
  postgres-master:
    image: postgres:15-alpine
    container_name: clinical-postgres-master
    environment:
      POSTGRES_DB: clinical_storage
      POSTGRES_USER: clinical_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - clinical-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical_admin -d clinical_storage"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Replica (optionnel pour prod)
  postgres-replica:
    image: postgres:15-alpine
    container_name: clinical-postgres-replica
    environment:
      POSTGRES_DB: clinical_storage
      POSTGRES_USER: clinical_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - clinical-network
    depends_on:
      - postgres-master
    profiles:
      - production

  # Redis
  redis:
    image: redis:7-alpine
    container_name: clinical-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - clinical-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: clinical-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: clinical
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - clinical-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: clinical-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    networks:
      - clinical-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Database migrations (runs once before services start)
  db-migrate:
    build:
      context: ./backend
      dockerfile: database/Dockerfile
    container_name: clinical-db-migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://clinical_admin:${POSTGRES_PASSWORD}@postgres-master:5432/clinical_storage
    depends_on:
      postgres-master:
        condition: service_healthy
    networks:
      - clinical-network
    restart: "no"

  # Auth Service
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: clinical-auth-service
    environment:
      DATABASE_URL: postgresql+asyncpg://clinical_admin:${POSTGRES_PASSWORD}@postgres-master:5432/clinical_storage
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "8000:8000"
    depends_on:
      postgres-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - clinical-network
    restart: unless-stopped

  # Core API Service
  core-api:
    build:
      context: ./backend
      dockerfile: core-api/Dockerfile
    container_name: clinical-core-api
    environment:
      DATABASE_URL: postgresql+asyncpg://clinical_admin:${POSTGRES_PASSWORD}@postgres-master:5432/clinical_storage
      REDIS_URL: redis://redis:6379/1
      AUTH_SERVICE_URL: http://auth-service:8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "8001:8001"
    depends_on:
      postgres-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - clinical-network
    restart: unless-stopped

  # RFID Service
  rfid-service:
    build:
      context: ./backend
      dockerfile: rfid-service/Dockerfile
    container_name: clinical-rfid-service
    environment:
      DATABASE_URL: postgresql+asyncpg://clinical_admin:${POSTGRES_PASSWORD}@postgres-master:5432/clinical_storage
      REDIS_URL: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "8002:8002"
    depends_on:
      postgres-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - clinical-network
    restart: unless-stopped
    # privileged: true  # Si accès hardware USB RFID

  # Workflow Engine
  workflow-engine:
    build:
      context: ./backend
      dockerfile: workflow-engine/Dockerfile
    container_name: clinical-workflow-engine
    environment:
      DATABASE_URL: postgresql+asyncpg://clinical_admin:${POSTGRES_PASSWORD}@postgres-master:5432/clinical_storage
      REDIS_URL: redis://redis:6379/3
      RABBITMQ_URL: amqp://clinical:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "8003:8003"
    depends_on:
      postgres-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - clinical-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: clinical-notification-service
    environment:
      DATABASE_URL: postgresql+asyncpg://clinical_admin:${POSTGRES_PASSWORD}@postgres-master:5432/clinical_storage
      REDIS_URL: redis://redis:6379/4
      RABBITMQ_URL: amqp://clinical:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "8004:8004"
    depends_on:
      postgres-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - clinical-network
    restart: unless-stopped

  # Reporting Service
  reporting-service:
    build:
      context: ./backend
      dockerfile: reporting-service/Dockerfile
    container_name: clinical-reporting-service
    environment:
      DATABASE_URL: postgresql+asyncpg://clinical_admin:${POSTGRES_PASSWORD}@postgres-master:5432/clinical_storage
      REDIS_URL: redis://redis:6379/5
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "8005:8005"
    depends_on:
      postgres-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - clinical-network
    restart: unless-stopped

  # Audit Service
  audit-service:
    build:
      context: ./backend
      dockerfile: audit-service/Dockerfile
    container_name: clinical-audit-service
    environment:
      DATABASE_URL: postgresql+asyncpg://clinical_admin:${POSTGRES_PASSWORD}@postgres-master:5432/clinical_storage
      REDIS_URL: redis://redis:6379/6
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "8006:8006"
    depends_on:
      postgres-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - clinical-network
    restart: unless-stopped

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: clinical-celery-worker
    command: celery -A app.celery worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://clinical_admin:${POSTGRES_PASSWORD}@postgres-master:5432/clinical_storage
      REDIS_URL: redis://redis:6379/4
      RABBITMQ_URL: amqp://clinical:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - clinical-network
    restart: unless-stopped

  # Frontend (React/Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinical-frontend
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - core-api
    networks:
      - clinical-network
    restart: unless-stopped

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: clinical-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      - frontend
      - auth-service
      - core-api
      - rfid-service
      - workflow-engine
      - notification-service
      - reporting-service
      - audit-service
    networks:
      - clinical-network
    restart: unless-stopped

networks:
  clinical-network:
    driver: bridge

volumes:
  postgres_master_data:
  postgres_replica_data:
  redis_data:
  rabbitmq_data:
  minio_data: